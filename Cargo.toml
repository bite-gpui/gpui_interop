[workspace]
resolver = "2"
members = [
    "crates/gpui_interop",
    "crates/interop_demo",
    "examples/interop_wgpu",
    "examples/interop_bevy",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bite-gpui/gpui_interop"
# The registries this workspace may be published to; `crates-io` is the default.
publish = ["crates-io"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"

# `gpui-interop` builds the core from a path in a *separate* workspace, so it does not inherit
# `bite-gpui`'s `[profile.dev.package]` tuning. A debug build would then run the layout engine and
# the text shaper at opt-level 0: `interop_wgpu` measured 33–47 ms per frame in `layout` alone,
# which looks like a renderer problem but is a build-profile one. Core already optimises `taffy`;
# the shaping crates are just as hot because each metric string is shaped as it changes.
[profile.dev.package]
taffy = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
fontdb = { opt-level = 3 }
skrifa = { opt-level = 3 }
# The Bevy example vendors a whole engine next to the core; at opt-level 0 its ECS, render graph and
# PBR pipeline dominate the frame, which would make the GPU comparison meaningless. These are the
# crates on the producer's hot path. `wgpu` is shared with the core, so tuning it helps every
# example, not just this one.
bevy_app = { opt-level = 3 }
bevy_asset = { opt-level = 3 }
bevy_a11y = { opt-level = 3 }
bevy_camera = { opt-level = 3 }
bevy_color = { opt-level = 3 }
bevy_core_pipeline = { opt-level = 3 }
bevy_diagnostic = { opt-level = 3 }
bevy_ecs = { opt-level = 3 }
bevy_gltf = { opt-level = 3 }
bevy_image = { opt-level = 3 }
bevy_input = { opt-level = 3 }
bevy_internal = { opt-level = 3 }
bevy_light = { opt-level = 3 }
bevy_material = { opt-level = 3 }
bevy_math = { opt-level = 3 }
bevy_mesh = { opt-level = 3 }
bevy_pbr = { opt-level = 3 }
bevy_platform = { opt-level = 3 }
bevy_ptr = { opt-level = 3 }
bevy_reflect = { opt-level = 3 }
bevy_render = { opt-level = 3 }
bevy_shader = { opt-level = 3 }
bevy_tasks = { opt-level = 3 }
bevy_time = { opt-level = 3 }
bevy_transform = { opt-level = 3 }
bevy_utils = { opt-level = 3 }
bevy_window = { opt-level = 3 }
bevy_world_serialization = { opt-level = 3 }
bevy = { opt-level = 3 }
wgpu = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
naga = { opt-level = 3 }
naga_oil = { opt-level = 3 }
glam = { opt-level = 3 }
encase = { opt-level = 3 }

[workspace.dependencies]
# This repo's own crates: a path for development, a version for release.
gpui_interop = { version = "0.1.2", path = "crates/gpui_interop" }
# The chrome the two producer demos share (controls, histogram, metrics panel). Private: it is not
# part of the published surface, only of the examples in this workspace.
interop_demo = { path = "crates/interop_demo" }

# The core, from the working tree next door — `bite-gpui`'s own checkout, so a fix in `gpui_wgpu`
# (the dma-buf importer) reaches this stack without a release. Each key keeps its source name, so
# every `use gpui::…` in the crate and its examples keeps compiling unchanged.
#
# These are path-only on purpose. The registry knows the same crates under the distribution's names
# (`bite-gpui`, `bite-gp-engine`, `bite-gp-wgpu`, `bite-gp-windows`), but Cargo cannot rename a
# *path* dependency: the package at the path is named `gpui`, so `package = "bite-gpui"` would look
# for a package that is not there. Publishing therefore stages a copy of this workspace with the
# four lines rewritten to their published packages — `scripts/prepare-publish.py` — which is the
# same path the out-of-tree crates take on release.
gpui = { path = "../bite-gpui/crates/gpui", default-features = false }
gpui_engine = { path = "../bite-gpui/crates/gpui_engine" }
gpui_wgpu = { path = "../bite-gpui/crates/gpui_wgpu" }
gpui_windows = { path = "../bite-gpui/crates/gpui_windows" }

# Third-party, at the versions the core resolves to, so one graph holds one copy of each.
anyhow = "1.0.86"
futures = "0.3"
wgpu = "29.0.4"
windows = { version = "0.62", features = [
