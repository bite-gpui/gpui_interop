# gpui_interop's own CI.
#
# One arm per platform the crate produces on. Neither needs a display: the Windows arm opens a hidden
# Direct3D window, and the Linux arm is a bare Vulkan device its tests allocate and export on.
#
# The Linux example (`examples/interop_linux.rs`) is deliberately not built here. Its `example`
# feature turns on the facade's platform bundle, which compiles the windowing stack and needs the
# system graphics libraries a bare runner does not carry; the library and its tests use none of it,
# so keeping the example out is what lets this job run on a stock image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The Linux hatch, end to end in the unit tests
  # (`crates/gpui_interop/src/linux.rs`): a linear and a driver-tiled shareable image exported as
  # dma-bufs, a two-plane NV12 buffer, a fence that exports a `sync_file`, and a cleared buffer.
  #
  # The crate builds headless -- `gpui` is taken with `default-features = false`, so no platform
  # backend and no system graphics libraries are compiled -- and the tests reach Vulkan through
  # `libvulkan.so.1`, which `libvulkan1` provides. `mesa-vulkan-drivers` brings lavapipe, a software
  # device, so the tests run rather than skip; where that driver offers no dma-buf export they skip
  # anyway, by design, so this row stays green on any image that lacks a suitable device.
  linux-interop:
    name: cargo test -p gpui_interop (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: steps::checkout_core
        shell: bash
        run: git clone --depth 1 --single-branch --branch bite_1.23.305 https://github.com/bite-gpui/bite-gpui.git ../bite-gpui
      - name: steps::install_vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: steps::cargo_test
        run: cargo test -p gpui_interop

  # The cross-device arm, on Windows: a Direct3D 12 producer's shared texture, opened on GPUI's
  # Direct3D 11 renderer and composited byte for byte
  # (`crates/gpui_interop/tests/cross_device_surface.rs`). Debug rather than a release profile: the
  # test adds no HLSL of its own, so there is no `fxc`-only artifact it needs, and the renderer it
  # drives still compiles its shaders at run time from the source in the checkout.
  #
  # The filter is the test's own name: `cargo test`'s filter matches test names, and the file's name
  # is a binary rather than a test, so `cross_device_surface` would match nothing. `grep` stops the
  # gate passing vacuously if the filter ever stops matching anything.
  #
  # A second guard stops it passing *hollowly*. The test skips by returning `Ok(())` -- no Direct3D
  # 12 device, no DirectComposition, no window -- and says so on stderr. `--nocapture` is what lets
  # that message past libtest's capture, and the `! grep` turns it into a failure, so this row
  # insists the cross-device path was genuinely exercised. That is safe to demand here and would not
  # be on a developer's machine: a hosted Windows runner always has WARP, so a skip means the runner
  # or the test regressed, not that the hardware is absent.
  windows-interop:
    name: cargo test -p gpui_interop a_shared_d3d12_surface (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: steps::checkout_core
        shell: bash
        run: git clone --depth 1 --single-branch --branch bite_1.23.305 https://github.com/bite-gpui/bite-gpui.git ../bite-gpui
      - shell: bash
        run: |
          set -o pipefail
          cargo test -p gpui_interop a_shared_d3d12_surface -- --nocapture 2>&1 | tee cross-device-surface.log
          grep -qE "test result: ok\. [1-9][0-9]* passed" cross-device-surface.log
          ! grep -q "skipping" cross-device-surface.log

  # The publishable package, checked on every change. `scripts/prepare-publish.py`
  # stages a copy with the four core path dependencies rewritten to their published
  # names, and Cargo then verifies the package the way crates.io will: the manifest,
  # the file set, and the crate built against the published `bite-gp-*` crates. This
  # catches a path dependency without a version, a missing README or licence, and a
  # feature the published core no longer provides, before a release tag exists.
  package:
    name: cargo publish --dry-run -p gpui_interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: steps::stage_publishable_tree
        run: python3 scripts/prepare-publish.py "$RUNNER_TEMP/gpui-interop-publish"
      - name: steps::cargo_publish_dry_run
        working-directory: ${{ runner.temp }}/gpui-interop-publish
        run: |
          cargo publish --dry-run -p gpui_interop
          cargo publish --dry-run -p gpui_interop --features gpui,wgpu,guest
