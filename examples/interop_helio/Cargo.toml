[package]
name = "interop_helio"
version = "0.0.0"
edition.workspace = true
publish = false

[lints]
workspace = true

# Experimental: Helio is not on crates.io yet, and its renderer is built against wgpu 30 while the
# GPUI stack is wgpu 29. Both majors coexist in this binary because no wgpu type crosses between
# them: Helio's frame leaves as a dma-buf and is imported by GPUI's own device. See the module
# documentation.
[[bin]]
name = "interop_helio"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
# The exporter in `gpui_interop` is expressed in Vulkan handles, so this example names the same
# `ash` (0.38) that `gpui_interop` and wgpu-hal 30 use.
ash = "0.38"
gpui.workspace = true
gpui_interop = { workspace = true, features = ["example"] }
gpui_wgpu.workspace = true
interop_demo.workspace = true
# The release descriptor is an `eventfd` the renderer writes to once it has sampled a frame.
libc = "0.2"

# Helio's own renderer, upstream `main`. It authors scenes through SceneDB and builds against
# wgpu 30.0.1 from Far-Beyond-Pulsar's fork, which the workspace root patches in.
wgpu30 = { package = "wgpu", version = "30.0.0", features = [
    "vulkan",
    "vulkan-portability",
    "gles",
    "wgsl",
] }
helio = { git = "https://github.com/Vanuan/Helio", rev = "daf54b414d3830853043c40ad8ea101808bf01be" }
helio-default-graphs = { git = "https://github.com/Vanuan/Helio", rev = "daf54b414d3830853043c40ad8ea101808bf01be" }
# SceneDB is the sole scene authority at this revision; the components are pass-owned.
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "8b5b1144c4ef80411592985fcd9767134ee03941", features = ["gpu"] }
helio-pass-gbuffer = { git = "https://github.com/Vanuan/Helio", rev = "daf54b414d3830853043c40ad8ea101808bf01be" }
helio-pass-forward-lit = { git = "https://github.com/Vanuan/Helio", rev = "daf54b414d3830853043c40ad8ea101808bf01be" }
helio-pass-sky = { git = "https://github.com/Vanuan/Helio", rev = "daf54b414d3830853043c40ad8ea101808bf01be" }
# The one-pass micro graph; its upstream builder does not lock the graph.
helio-pass-simple-cube = { git = "https://github.com/Vanuan/Helio", rev = "daf54b414d3830853043c40ad8ea101808bf01be" }
glam = { version = "0.33", features = ["bytemuck"] }
pollster = "0.4"
