[package]
name = "interop_helio"
version = "0.0.0"
edition.workspace = true
publish = false

[lints]
workspace = true

# Experimental: Helio is not on crates.io yet, and its renderer is built against wgpu 30 while the
# GPUI stack is wgpu 29. Both majors coexist in this binary because no wgpu type crosses between
# them; the frame is copied on the CPU for this first scaffold. See the module documentation.
[[bin]]
name = "interop_helio"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_interop = { workspace = true, features = ["example"] }
gpui_wgpu.workspace = true
interop_demo.workspace = true
wgpu.workspace = true

# Helio's own renderer. The revision is the one the `Helio_Standalone_Demo` pins.
wgpu30 = { package = "wgpu", version = "30.0.0", features = [
    "vulkan",
    "vulkan-portability",
    "gles",
    "wgsl",
] }
helio = { git = "https://github.com/Far-Beyond-Pulsar/Helio", rev = "4356a855e33b691aac10621e712bd973d8c4b68b" }
helio-default-graphs = { git = "https://github.com/Far-Beyond-Pulsar/Helio", rev = "4356a855e33b691aac10621e712bd973d8c4b68b" }
glam = { version = "0.33", features = ["bytemuck"] }
pollster = "0.4"
